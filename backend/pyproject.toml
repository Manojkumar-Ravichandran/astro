[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-market-analyzer"
version = "0.1.0"
description = "Local-first astronomical event research engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pysweph>=2.10.3.6",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["astro_market*"]
